[pytest]
testpaths = tests
addopts = -q -m "not slow and not llm"
markers =
    slow: pruebas de integración que corren OCR real (requieren Tesseract + tessdata/ y los PDFs del reto). Correr con: pytest -m slow
    llm: pruebas que llaman al LLM real (Ollama con qwen3.5:9b, o Claude si LLM_PROVIDER=online). Correr con: pytest -m llm
filterwarnings =
    ignore::DeprecationWarning
